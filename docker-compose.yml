services:
  mulaim:
    build:
      context: .
      dockerfile: Dockerfile
    image: mulaim:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
