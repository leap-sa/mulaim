[package]
name = "mulaim"
version = "0.2.0"
edition = "2021"
description = "Estimate whether a local LLM quantization fits comfortably on your machine — CLI, web app (EN/AR), and JSON API. Hosted & operated by LEAP RD&O واثب."
license = "MIT"
authors = ["LEAP RD&O واثب <info@leap.sa>"]
homepage = "https://leap.sa"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
strip = true
lto = true
